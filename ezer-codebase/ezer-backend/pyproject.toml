[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezer-backend"
version = "0.2.0"
description = "Ezer mail intelligence API (FastAPI, Python 3.12)"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  "ignore::DeprecationWarning:starlette",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
cache_dir = "/tmp/ezer-backend-pytest-cache"

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = "/tmp/ezer-backend-ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
cache_dir = "/tmp/ezer-backend-mypy-cache"
