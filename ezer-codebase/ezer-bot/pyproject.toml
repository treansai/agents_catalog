[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ezer"
version = "0.1.0"
description = "Read-only multi-agent email intelligence for Gmail and Outlook"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135,<1",
    "httpx>=0.28.1,<1",
    "langchain==1.3.17",
    "langchain-anthropic==1.6.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "msal==1.38.0",
    "prometheus-client>=0.22,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "pycryptodome>=3.23,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15,<3",
    "uvicorn>=0.40,<1",
]

[project.scripts]
ezer = "ezer.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ezer"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["ezer"]
