# Full Ezer stack: Next.js frontend -> FastAPI backend + FastAPI bot (Python).
# Values come from the root .env file.
name: ezer

services:
  backend:
    build:
      context: ./ezer-backend
    environment:
      EZER_MODE: ${EZER_MODE:-demo}
      EZER_API_KEY: ${EZER_API_KEY:-ezer-demo-key}
      # Bind on every interface so the published port actually reaches the app.
      EZER_HOST: 0.0.0.0
      EZER_PORT: "8080"
      EZER_DATA_FILE: /app/data/ezer.json
      EZER_DEMO_RESET_ON_START: ${EZER_DEMO_RESET_ON_START:-false}
      EZER_SYNC_DEFAULT_LIMIT: ${EZER_SYNC_DEFAULT_LIMIT:-50}
      EZER_SYNC_MAX_LIMIT: ${EZER_SYNC_MAX_LIMIT:-500}
      # Comptes connectables et application Entra publique du flux device code.
      EZER_ACCOUNTS_JSON: ${EZER_ACCOUNTS_JSON:-[]}
      EZER_OUTLOOK_CLIENT_ID: ${EZER_OUTLOOK_CLIENT_ID:-}
      # Refresh tokens délégués, sur le volume, hors du fichier de données du tableau de bord.
      EZER_TOKEN_FILE: /app/data/tokens.json
      # Cartographie : géocodage côté serveur, routage sur un service au protocole OSRM.
      EZER_MAPTILER_KEY: ${EZER_MAPTILER_KEY:-}
      EZER_MAPTILER_STYLE: ${EZER_MAPTILER_STYLE:-streets-v2-dark}
      EZER_ROUTING_URL: ${EZER_ROUTING_URL:-}
      EZER_DEFAULT_ORIGIN: ${EZER_DEFAULT_ORIGIN:-Paris, France}
      # Géocodeur de repli sans clé. Vide = désactivé, aucun appel sortant.
      EZER_NOMINATIM_URL: ${EZER_NOMINATIM_URL-https://nominatim.openstreetmap.org}
      EZER_MAP_CONTACT: ${EZER_MAP_CONTACT:-ezer-agent-ui}
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:${EZER_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2); sys.exit(0)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bot-api:
    build:
      context: ./ezer-bot
    environment:
      EZER_HOST: 0.0.0.0
      EZER_PORT: "8080"
      EZER_API_KEY: ${EZER_BOT_API_KEY:?set EZER_BOT_API_KEY in the root .env}
      EZER_ANTHROPIC_API_KEY: ${EZER_ANTHROPIC_API_KEY:?set EZER_ANTHROPIC_API_KEY in the root .env}
      EZER_ANTHROPIC_MODEL: ${EZER_ANTHROPIC_MODEL:-claude-sonnet-5}
      EZER_BACKEND_URL: http://backend:8080
      EZER_BACKEND_API_KEY: ${EZER_API_KEY:-ezer-demo-key}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EZER_BOT_PORT:-8081}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2); sys.exit(0)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped

  front:
    build:
      context: ./ezer-front
    environment:
      # Same-origin BFF calls the backend over the compose network.
      EZER_API_URL: http://backend:8080
      EZER_API_KEY: ${EZER_API_KEY:-ezer-demo-key}
      # L'assistant multi-agents est servi par le bot, pas par le backend.
      EZER_BOT_URL: http://bot-api:8080
      EZER_BOT_API_KEY: ${EZER_BOT_API_KEY:?set EZER_BOT_API_KEY in the root .env}
      # Absent => les routes vocales répondent « non configurée » au lieu de planter.
      # ElevenLabs entend et parle ; OpenAI ne sert plus qu'à lire l'ordre du tableau de bord.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
      ELEVENLABS_STT_LANGUAGE: ${ELEVENLABS_STT_LANGUAGE:-fra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-gpt-4.1-mini}
      # Fond de carte : la clé est lue à l'exécution, pas figée dans l'image.
      EZER_MAPTILER_KEY: ${EZER_MAPTILER_KEY:-}
      EZER_MAPTILER_STYLE: ${EZER_MAPTILER_STYLE:-streets-v2-dark}
    depends_on:
      backend:
        condition: service_healthy
      bot-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EZER_FRONT_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ezer/snapshot').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  backend-data:
